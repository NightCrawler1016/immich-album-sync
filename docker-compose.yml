services:
  immich-album-sync:
    image: ghcr.io/nightcrawler1016/immich-album-sync:latest
    container_name: immich-album-sync
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - /mnt/user/appdata/immich-album-sync:/app/appdata
    environment:
      # REQUIRED: change this to a unique 32–64 char random string.
      # The container REFUSES TO START while this is left at the placeholder.
      - SECRET_KEY=change-me-to-a-unique-random-32-64-char-string
      # Optional: Set your timezone
      - TZ=America/New_York
      # Optional: UID/GID the app runs as (no longer root). 99:100 = Unraid
      # nobody:users. Change only if your appdata is owned by another user.
      - PUID=99
      - PGID=100
      # Optional: Set to "true" to delete cached files after successful upload
      - CLEANUP_CACHE=false
      # Optional HTTPS (off by default — plain http:// is fine on a home LAN).
      # Serve HTTPS directly on 8080 with your own PEM cert + key:
      # - HTTPS_CERT_FILE=/app/appdata/certs/cert.pem
      # - HTTPS_KEY_FILE=/app/appdata/certs/key.pem
      # …or, when an HTTPS reverse proxy is in front, secure the login cookie:
      # - SESSION_COOKIE_SECURE=true
    labels:
      - "net.unraid.docker.managed=dockerman"
      - "net.unraid.docker.webui=http://[IP]:[PORT:8080]"
      - "net.unraid.docker.icon=https://raw.githubusercontent.com/NightCrawler1016/immich-album-sync/main/icon.png"
